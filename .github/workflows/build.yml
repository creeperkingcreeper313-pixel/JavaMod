
name: Build Reql Client 26.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project
        run: |
          unzip Reql-Client-26.3-GitHub.zip
          test -f Reql-Client-26.3/settings.gradle
          test -f Reql-Client-26.3/build.gradle

      - name: Build mod
        run: gradle -p Reql-Client-26.3 build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Reql-Client-26.3
          path: Reql-Client-26.3/build/libs/*.jar
          if-no-files-found: error
          
