
name: Build Reql Client 26.3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el ZIP del proyecto"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon --stacktrace

      - name: Collect JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} artifacts/ \;
          test -n "$(find artifacts -name '*.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Reql-Client-26.3
          path: artifacts/*.jar
          if-no-files-found: error
          
