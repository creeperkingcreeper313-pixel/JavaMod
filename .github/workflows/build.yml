name: Build Reql Client 26.3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Extract project ZIP when uploaded at repository root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Reql-Client-26.3-GitHub.zip ]; then
            unzip -o Reql-Client-26.3-GitHub.zip
          fi

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] && [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f Reql-Client-26.3/settings.gradle ] && [ -f Reql-Client-26.3/build.gradle ]; then
            echo "PROJECT_DIR=Reql-Client-26.3" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle files not found. Upload the ZIP to the repository root."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Compile
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon --stacktrace

      - name: Collect production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Reql-Client-26.3
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
          
